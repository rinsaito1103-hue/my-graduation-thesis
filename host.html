<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👨‍🏫 農トレ - 先生用コントロールパネル</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #1e293b; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #0f172a; padding: 30px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        .status-box { background: #334155; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .control-group { margin-bottom: 20px; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #475569; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; font-size: 14px; }
        select { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #f8fafc; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background-color: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(220, 38, 38, 0.3); }
        button:hover { background-color: #b91c1c; transform: translateY(2px); box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3); }
        .btn-blue { background-color: #2563eb; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3); margin-bottom: 15px; }
        .btn-blue:hover { background-color: #1d4ed8; box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3); }
        #log-area { margin-top: 20px; padding: 10px; background: #000; color: #22c55e; font-family: monospace; font-size: 12px; border-radius: 6px; height: 100px; overflow-y: auto; margin-bottom: 20px;}
        
        /* ランキング表のスタイル */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #334155; color: #94a3b8; font-size: 14px; }
        td { font-size: 16px; font-weight: bold; }
        .rank-1 { color: #fbbf24; font-size: 20px; } /* 1位はゴールド */
        .rank-2 { color: #94a3b8; font-size: 18px; } /* 2位はシルバー */
        .rank-3 { color: #b45309; font-size: 18px; } /* 3位はブロンズ */
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const SUPABASE_URL = 'https://lozwsuhkcbuzbdynnyml.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvendzdWhrY2J1emJkeW5ueW1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDg1MzgsImV4cCI6MjA5NjEyNDUzOH0.bmk4mz5NyNUqWlImBqWBRISQAzJq3GF6Ply7mG3yNAc'; // ⚠️ ここをご自身の本物のキーにしてください！

            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const statusEl = document.getElementById("connection-status");
            const logArea = document.getElementById("log-area");

            // チャンネルを作成して接続
            const channel = supabaseClient.channel('nototore-room');

            channel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    statusEl.innerHTML = "🟢 サーバー接続完了（配信・受信準備OK）";
                    statusEl.style.color = "#4ade80";
                } else {
                    statusEl.innerHTML = "🔴 接続中... またはエラー";
                    statusEl.style.color = "#f87171";
                }
            });

            // 📡 イベント送信ボタンの処理
            document.getElementById("broadcast-btn").addEventListener("click", async () => {
                const globalEventId = document.getElementById("global-select").value;
                const localEventId = document.getElementById("local-select").value;
                const globalName = document.getElementById("global-select").options[document.getElementById("global-select").selectedIndex].text;
                const localName = document.getElementById("local-select").options[document.getElementById("local-select").selectedIndex].text;

                if (!confirm(`【確認】\n全体環境: ${globalName}\n局地環境: ${localName}\n\nこのイベントを全班の画面に一斉送信しますか？`)) {
                    return;
                }

                await channel.send({
                    type: 'broadcast',
                    event: 'yearly_events',
                    payload: { global_id: globalEventId, local_id: localEventId }
                });

                const time = new Date().toLocaleTimeString();
                logArea.innerHTML += `[${time}] 📡 配信完了: ${globalName} / ${localName}<br>`;
                logArea.scrollTop = logArea.scrollHeight;
            });

            // 🏆 ランキング取得ボタンの処理
            document.getElementById("fetch-ranking-btn").addEventListener("click", async () => {
                const tbody = document.getElementById("ranking-tbody");
                tbody.innerHTML = "<tr><td colspan='3' style='text-align:center;'>読み込み中...</td></tr>";

                // Supabaseから scores テーブルのデータを金額順（降序）で取得
                const { data, error } = await supabaseClient
                    .from('scores')
                    .select('*')
                    .order('final_money', { ascending: false });

                if (error) {
                    console.error("取得エラー", error);
                    tbody.innerHTML = `<tr><td colspan='3' style='color:#ef4444;'>エラーが発生しました</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#94a3b8;'>まだ完了したチームがいません</td></tr>";
                    return;
                }

                // 取得したデータを表に流し込む
                data.forEach((row, index) => {
                    let rankClass = "";
                    let rankIcon = `${index + 1}位`;
                    if (index === 0) { rankClass = "rank-1"; rankIcon = "🥇 1位"; }
                    else if (index === 1) { rankClass = "rank-2"; rankIcon = "🥈 2位"; }
                    else if (index === 2) { rankClass = "rank-3"; rankIcon = "🥉 3位"; }

                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="${rankClass}">${rankIcon}</td>
                        <td>${row.player_name}</td>
                        <td style="color:#4ade80;">${row.final_money.toLocaleString()} 円</td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        });
    </script>
</head>
<body>

    <div class="container">
        <h1>👨‍🏫 農トレ コントロールパネル</h1>
        
        <div class="status-box" id="connection-status">
            🟡 サーバーへ接続しています...
        </div>

        <div class="control-group">
            <label>🌍 全体環境イベント（価格変動）を選ぶ</label>
            <select id="global-select">
                <option value="normal">通常（変動なし）</option>
                <option value="boom_exotic">📈 ブーム（外来野菜: アーティチョーク高騰）</option>
                <option value="boom_traditional">📈 ブーム（伝統野菜: 仙台白菜高騰）</option>
                <option value="rival">📉 ライバル出現（六次産業価格下落）</option>
                <option value="bumper_crop">📉 豊作貧乏（一般的な野菜の価格暴落）</option>
                <option value="poor_crop">📈 全国的な凶作（価格急高騰）</option>
            </select>
        </div>

        <div class="control-group">
            <label>📍 局地環境イベント（収量変動）を選ぶ</label>
            <select id="local-select">
                <option value="normal">通常（変動なし）</option>
                <option value="pest">🐛 害虫発生（収量減・農薬で防御可）</option>
                <option value="disease">🦠 病気蔓延（特定作物全滅）</option>
                <option value="heavy_rain">☔ 記録的豪雨（ハウス以外大ダメージ）</option>
                <option value="bad_growth">🥀 生育不良（肥料でブースト可）</option>
                <option value="animal_damage">🐗 獣害（問答無用で全滅）</option>
                <option value="good_weather">☀️ 奇跡の豊作（全農地の収量2倍）</option>
            </select>
        </div>

        <button id="broadcast-btn">📡 このイベントを全班へ一斉配信する</button>

        <div id="log-area">
            // 通信ログ<br>
        </div>

        <hr style="border: 1px dashed #475569; margin: 30px 0;">
        <h2 style="color: #fbbf24; text-align: center; margin-top: 0;">🏆 最終成績ランキング</h2>
        
        <button id="fetch-ranking-btn" class="btn-blue">🔄 最新のランキングを取得する</button>

        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">順位</th>
                    <th style="width: 40%;">班（プレイヤー）名</th>
                    <th style="width: 40%;">最終資金残高</th>
                </tr>
            </thead>
            <tbody id="ranking-tbody">
                <tr>
                    <td colspan="3" style="text-align:center; color:#94a3b8; font-weight:normal;">ボタンを押して結果を取得してください</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
